server {
  listen 8080;
  root /usr/share/nginx/html/;
  server_tokens off;
  client_max_body_size 200m;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml application/wasm application/font-woff application/font-woff2 font/opentype application/x-font-ttf;

  # Content types come from nginx's built-in mime.types (which already maps .wasm to application/wasm).
  # Never add a `types { }` block here: it would REPLACE that whole map, and every page would be served as
  # application/octet-stream (a download) instead of text/html.

  # Next's hashed build output and the hashed 3D assets never change: cache them hard.
  location ~ ^/(_next/static|models|textures|decoders|video)/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Static export: /lab is lab.html, / is index.html; anything else is the 404 page.
  # Pages themselves must be re-checked on every visit: without a Cache-Control header browsers cache the
  # HTML on their own guess, keep pointing at the previous build's CSS and JS, and a new deploy doesn't
  # show until a hard refresh.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
}
