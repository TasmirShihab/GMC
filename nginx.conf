server {
  listen 8080;
  root /usr/share/nginx/html/;
  server_tokens off;
  client_max_body_size 200m;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml image/svg+xml application/wasm application/font-woff application/font-woff2 font/opentype application/x-font-ttf;

  # .wasm (Draco/Basis decoders) must be served as wasm for streaming compile
  types {
    application/wasm wasm;
  }

  # Next's hashed build output and the hashed 3D assets never change: cache them hard.
  location ~ ^/(_next/static|models|textures|decoders|video)/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Static export: /lab is lab.html, / is index.html; anything else is the 404 page.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /404.html;
}
